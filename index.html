
<html>
<head>
<title>Online Art Gallery</title>
<style>
body{margin:0;font-family:Arial;background-color:beige;}
.header{background-color:lightblue;display:flex;padding:15px;align-items:center;}
.logo{width:25%;text-align:center;}
.search{width:40%;text-align:center;}
.search input{padding:8px;margin:5px;}
.search input[type="text"]{width:200px;}
.links{width:35%;text-align:center;}
.links a{text-decoration:none;margin:5px;color:black;}
.menu{background-color:lightgray;display:flex;justify-content:space-around;padding:12px;}
.menu a{text-decoration:none;color:black;font-weight:bold;}
.home{background-color:beige;text-align:center;padding:30px;}
.gallery-title{background-color:lightpink;text-align:center;padding:15px;}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px;}
.artwork{border:1px solid black;text-align:center;padding:15px;}
.artwork img{width:200px;height:150px;}
.artwork input{padding:8px 15px;}
.artist-title{background-color:lightgreen;text-align:center;padding:15px;}
.artists{display:flex;justify-content:space-around;padding:20px;}
.artist{border:1px solid black;width:25%;text-align:center;padding:15px;}
.exhibition{background-color:lightyellow;text-align:center;padding:20px;}
.auction{background-color:lightblue;text-align:center;padding:20px;}
.auction input{padding:10px;margin:5px;}
#bidMessage{font-size:14px;}
.reviews{background-color:lightpink;text-align:center;padding:20px;}
.review-form{margin:10px;}
.review-form input{padding:10px;margin:5px;}
.profile{background-color:white;text-align:center;padding:30px;border-top:2px solid black;}
.profile-box{background-color:aliceblue;border:1px solid black;width:50%;margin:auto;padding:20px;}
.profile-box p{font-size:16px;}
.artist-profile{background-color:lightgreen;text-align:center;padding:30px;}
.artist-form{background-color:white;border:1px solid black;width:50%;margin:auto;padding:25px;}
.artist-form input,.artist-form textarea{width:80%;padding:10px;margin:8px;box-sizing:border-box;}
.artist-form textarea{height:100px;}
.artist-form button{padding:10px 20px;background-color:lightblue;border:1px solid black;cursor:pointer;}
#artistMessage{font-weight:bold;}
.footer{background-color:black;color:white;text-align:center;padding:20px;}
.footer a{color:white;text-decoration:none;margin:5px;}
</style>
</head>
<body>
